services:
  codex-imagegen:
    build: .
    image: codex-imagegen:latest
    container_name: codex-imagegen
    restart: unless-stopped
    ports:
      - "3456:3456"
    env_file:
      - path: .env.docker
        required: false
    volumes:
      - codex-imagegen-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  codex-imagegen-data:
