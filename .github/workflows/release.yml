name: Build and Publish

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/codex-imagegen

jobs:
  build:
    name: Build app artifact
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        shell: pwsh
        run: |
          node --check src/auth.mjs
          node --check src/config.mjs
          node --check src/generate.mjs
          node --check src/index.mjs
          node --check src/pool.mjs
          node --check src/server.mjs
          node --check public/assets/management.js
          node --check public/assets/management-request.js

      - name: Test
        run: npm test

      - name: Compose config check
        run: docker compose config

      - name: Prepare portable package
        shell: pwsh
        run: |
          $dist = "dist/codex-imagegen"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item src $dist/src -Recurse
          Copy-Item public $dist/public -Recurse
          Copy-Item package.json,package-lock.json,README.md,.env.example,.env.docker.example,Dockerfile,docker-compose.yml,run_app.bat,create_shortcut.ps1,icon.ico,icon.png $dist
          Copy-Item deploy $dist/deploy -Recurse
          Compress-Archive -Path $dist -DestinationPath dist/codex-imagegen-portable.zip -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-imagegen-portable
          path: dist/codex-imagegen-portable.zip
          retention-days: 30

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
